apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi
  namespace: llmops
  labels:
    app: fastapi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      serviceAccountName: fastapi-sa
      containers:
        - name: fastapi
          image: 011528270076.dkr.ecr.us-east-1.amazonaws.com/llmops-bedrock-dev-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: KNOWLEDGE_BASE_ID
              value: "0OW8LBTZU5"
            - name: AWS_REGION
              value: "us-east-1"
            - name: REDIS_HOST
              value: "redis-service.llmops.svc.cluster.local"
            - name: MODEL_ARN
              value: "arn:aws:bedrock:us-east-1:011528270076:inference-profile/us.amazon.nova-pro-v1:0"
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: llmops-secrets
                  key: langfuse-public-key
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: llmops-secrets
                  key: langfuse-secret-key
            - name: LANGFUSE_HOST
              valueFrom:
                secretKeyRef:
                  name: llmops-secrets
                  key: langfuse-host
            - name: GUARDRAIL_ID
              valueFrom:
                secretKeyRef:
                  name: llmops-secrets
                  key: guardrail-id
            - name: GUARDRAIL_VERSION
              valueFrom:
                secretKeyRef:
                  name: llmops-secrets
                  key: guardrail-version
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-service
  namespace: llmops
spec:
  selector:
    app: fastapi
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
